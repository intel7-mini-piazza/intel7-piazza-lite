<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piazza-Lite | 질문 상세</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/question.css">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">Piazza-lite</a>
            <a href="index.html" class="header-nav-link">← 목록으로 돌아가기</a>
        </div>
    </header>

    <main class="container">
        <div class="question-page-layout">
            <div id="question-container">
                <!-- 질문 상세 정보 카드 -->
                <section class="detail-card" id="question-detail">
                    <h2 id="question-title" class="detail-title">로딩 중...</h2>
                    <div class="meta-info">
                        <span id="question-author"></span>
                        <span class="meta-sep">·</span>
                        <span id="question-tag" class="detail-tag"></span>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--piazza-border); margin: 16px 0;">
                    <div id="question-body" class="detail-body"></div>
                </section>

                <!-- 답변 목록 -->
                <section class="answers-card" id="answers-section">
                    <h3 class="section-title">답변 목록</h3>
                    <div id="answer-list"></div>
                </section>

                <!-- 답변 작성 폼 -->
                <section class="reply-card" id="answer-form-section">
                    <h3 class="section-title">내 답변 작성</h3>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label for="author" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px;">작성자 닉네임</label>
                        <input type="text" id="author" class="input-field" placeholder="BambooChat에 등록된 닉네임">
                    </div>
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label for="answer-body" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px;">답변 내용</label>
                        <textarea id="answer-body" class="input-field" rows="6" placeholder="해결 방법 및 코드 설명을 입력하세요"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end;">
                        <button id="submit-answer" class="btn btn-primary">답변 등록</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="js/question.js"></script>
</body>
</html>
