<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Piazza-Lite | 리다이렉트 중...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        if (id) {
            window.location.replace(`/?post=${encodeURIComponent(id)}`);
        } else {
            window.location.replace("/");
        }
    </script>
</head>
<body>
    <p>질문 상세 페이지로 이동 중입니다... <a href="/">여기를 클릭하세요</a></p>
</body>
</html>
