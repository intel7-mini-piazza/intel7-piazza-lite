<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piazza-lite</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <div class="header-inner">
            <h1 class="logo">대나무지식인</h1>

            <button id="askButton" class="ask-button">
                질문하기
            </button>
        </div>
    </header>


    <main class="container">

        <!-- 검색 및 새 게시물 영역 -->
        <section class="search-and-new-post">
            <form id="searchForm" class="search-form">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="질문 검색..."
                    autocomplete="off"
                >

                <button type="submit" class="search-button">
                    검색
                </button>
            </form>
        </section>


        <!-- 질문 목록 피드 및 상세 내용 -->
        <section class="piazza-content">
            
            <div id="postFeed" class="post-feed">
                <!-- JavaScript가 질문 카드를 여기에 넣습니다. -->
            </div>

            <div id="postDetail" class="post-detail">
                <div class="initial-message">
                    <h3>대나무 지식인의 주요 기능:</h3>
                    <ul>
                        <li>
                            <span class="step-icon">1</span>
                            <span><b>카테고리/태그</b>를 사용하여 과제, 프로젝트, 자유 질문을 깔끔하게 분류해 보세요.</span>
                        </li>
                        <li>
                            <span class="step-icon">2</span>
                            <span><b>답변 및 해결 상태</b>를 통해 어떤 질문에 도움이 필요한지 한눈에 파악하세요.</span>
                        </li>
                        <li>
                            <span class="step-icon">3</span>
                            <span><b>위키(Wiki) 방식</b>으로 동료들과 함께 단 하나의 완성도 높은 답변을 작성해보세요.</span>
                        </li>
                        <li>
                            <span class="step-icon">4</span>
                            <span><b>검색 및 필터링</b>을 통해 궁금한 질문이나 작성한 게시글만 빠르게 찾아보세요.</span>
                        </li>
                        <li>
                            <span class="step-icon">5</span>
                            <span><b>해결 완료 표시 및 추천</b>으로 유용한 정보와 질문을 서로 공유하고 응원하세요.</span>
                        </li>
                    </ul>
                    <div class="pagination">
                        <button class="arrow-button">&lt;</button>
                        <div class="dots">
                            <span class="dot active"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <button class="arrow-button">&gt;</button>
                    </div>
                </div>
            </div>

        </section>

    </main>


    <script src="home.js"></script>

</body>
</html>
